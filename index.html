<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Summarizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .app {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        @media (max-width: 1024px) {
            .app {
                grid-template-columns: 1fr;
            }
        }
        .input-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }
        .input-section h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }
        textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        textarea:focus, input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .status {
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
            font-weight: 500;
        }
        .status.show {
            display: block;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .output-section {
            display: grid;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .summary-text {
            line-height: 1.8;
            color: #555;
            font-size: 15px;
        }
        .attendees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .attendee-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .attendee-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
        }
        .attendee-name {
            font-size: 1.2em;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .attendee-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .todo-list {
            list-style: none;
        }
        .todo-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            word-break: break-word;
        }
        .todo-checkbox {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }
        .todo-text {
            flex: 1;
            color: #555;
            line-height: 1.5;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .export-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .export-btn:hover {
            background: #e0e0e0;
        }
        .export-btn.pdf {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }
        .export-btn.pdf:hover {
            background: #ff5252;
        }
        .export-btn.copy {
            background: #4ecdc4;
            color: white;
            border-color: #4ecdc4;
        }
        .export-btn.copy:hover {
            background: #45b7aa;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Meeting Summarizer</h1>
            <p>Transcribe, summarize, and organize action items by attendee</p>
        </div>

        <div class="app">
            <!-- Input Section -->
            <div class="input-section">
                <h2>Upload Meeting</h2>
                
                <div class="input-group">
                    <label for="transcript-input">Paste Transcript</label>
                    <textarea id="transcript-input" placeholder="Paste your meeting transcript here..."></textarea>
                </div>

                <div class="input-group">
                    <label for="audio-input">Or Upload Audio File</label>
                    <input type="file" id="audio-input" accept="audio/*" />
                </div>

                <div class="button-group">
                    <button class="btn-primary" id="process-btn">Process Meeting</button>
                    <button class="btn-secondary" id="clear-btn">Clear</button>
                </div>

                <div class="status" id="status"></div>
            </div>

            <!-- Output Section -->
            <div class="output-section">
                <!-- Summary Card -->
                <div class="card" id="summary-card" style="display: none;">
                    <h2>
                        <div class="card-icon">✨</div>
                        Summary
                    </h2>
                    <div class="summary-text" id="summary-text"></div>
                </div>

                <!-- Action Items by Attendee -->
                <div class="card" id="attendees-card" style="display: none;">
                    <h2>
                        <div class="card-icon">👥</div>
                        Action Items by Attendee
                    </h2>
                    <div class="attendees-grid" id="attendees-grid"></div>
                </div>

                <!-- Empty State -->
                <div class="card" id="empty-state">
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>Upload a meeting transcript or audio file to get started</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
